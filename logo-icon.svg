<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="icon-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Luxury Squircle Background -->
  <rect x="8" y="8" width="112" height="112" rx="32" fill="#0e0e12" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#icon-shadow)" />
  <rect x="8" y="8" width="112" height="112" rx="32" fill="url(#icon-glass)" />

  <!-- Outer Comment Bubble Structure -->
  <path d="M 38 46 C 38 37.163 45.163 30 54 30 L 74 30 C 82.837 30 90 37.163 90 46 L 90 66 C 90 74.837 82.837 82 74 82 L 56 82 L 40 94 L 43 82 C 39.5 79.5 38 73 38 66 Z" 
        stroke="url(#icon-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Inner Aerodynamic DM Paper Plane / Lightning Arrow -->
  <path d="M 54 57 L 88 44 L 78 76 L 68 64 L 54 57 Z" 
        fill="url(#icon-grad)" />
  <path d="M 68 64 L 88 44" 
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />
</svg>
